
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Copo de Koch - Galería Matemática</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* --------- VARIABLES CSS --------- */
    :root {
      --primary-color: #6366f1;
      --secondary-color: #8b5cf6;
      --accent-color: #06b6d4;
      --bg-primary: #0f0f23;
      --bg-secondary: #1a1a3e;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --shadow-glow: 0 0 50px rgba(99, 102, 241, 0.3);
    }

    /* --------- RESET Y BASE --------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* --------- FONDO ANIMADO --------- */
    .background-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(45deg, #0f0f23, #1a1a3e, #2d1b69);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    .background-animation::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(1deg); }
      66% { transform: translateY(10px) rotate(-1deg); }
    }

    /* --------- PARTÍCULAS FLOTANTES --------- */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
      border-radius: 50%;
      animation: particleFloat 15s infinite linear;
      opacity: 0.6;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* --------- CONTENEDOR PRINCIPAL --------- */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
    }

    /* --------- HEADER --------- */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: slideInDown 1s ease-out;
    }

    .title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color), var(--accent-color));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientText 3s ease infinite;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    @keyframes gradientText {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --------- PANEL DE CONTROL --------- */
    .control-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 3rem;
      box-shadow: var(--shadow-glow);
      animation: slideInUp 1s ease-out 0.3s both;
      position: relative;
      overflow: hidden;
    }

    .control-panel::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--accent-color));
      border-radius: 20px;
      z-index: -1;
      animation: borderGlow 3s ease infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .control-form {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .label {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }

    .input {
      padding: 0.75rem 1.5rem;
      border: 2px solid var(--glass-border);
      border-radius: 15px;
      background: var(--glass-bg);
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
      width: 100px;
      transition: all 0.3s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      transform: scale(1.05);
    }

    .generate-btn {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border: none;
      color: var(--text-primary);
      font-weight: 600;
      padding: 1rem 2.5rem;
      border-radius: 15px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .generate-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .generate-btn:hover::before {
      left: 100%;
    }

    .generate-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .generate-btn:active {
      transform: translateY(-1px);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --------- GALERÍA DE FRACTAL --------- */
    .fractal-gallery {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      padding: 2rem;
      box-shadow: var(--shadow-glow);
      max-width: 95%;
      width: fit-content;
      animation: slideInUp 1s ease-out 0.6s both;
      position: relative;
      overflow: hidden;
    }

    .fractal-gallery::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, 
        rgba(99, 102, 241, 0.1),
        rgba(139, 92, 246, 0.1),
        rgba(6, 182, 212, 0.1)
      );
      border-radius: 25px;
      z-index: -1;
      animation: colorShift 8s ease infinite;
    }

    @keyframes colorShift {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
    }

    .fractal-image {
      max-width: 100%;
      height: auto;
      border-radius: 20px;
      display: block;
      margin: auto;
      transition: all 0.5s ease;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
    }

    .fractal-image:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.4)) 
              brightness(1.1) contrast(1.1);
    }

    /* --------- FOOTER --------- */
    .footer {
      margin-top: auto;
      padding-top: 3rem;
      text-align: center;
      animation: slideInUp 1s ease-out 0.9s both;
    }

    .footer-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    .footer-text .heart {
      color: #ef4444;
      animation: heartbeat 2s ease infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* --------- RESPONSIVE --------- */
    @media (max-width: 768px) {
      .control-form {
        flex-direction: column;
        gap: 1.5rem;
      }

      .input, .generate-btn {
        width: 100%;
        max-width: 250px;
      }

      .container {
        padding: 1rem;
      }

      .control-panel, .fractal-gallery {
        margin-left: 1rem;
        margin-right: 1rem;
      }
    }

    /* --------- LOADING ANIMATION --------- */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--text-primary);
      animation: spin 1s ease-in-out infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="background-animation"></div>
  
  <div class="particles" id="particles"></div>

  <div class="container">
    <header class="header">
      <h1 class="title">Copo de Koch</h1>
    </header>

    <div class="control-panel">
      <form class="control-form" method="get" action="/">
        <div class="input-group">
          <label class="label" for="nivel">Orden</label>
          <input 
            class="input" 
            type="number" 
            id="nivel" 
            name="nivel" 
            value="{{ nivel }}" 
            min="0" 
            max="6"
          >
        </div>
        <button class="generate-btn" type="submit">
          Generar Fractal
        </button>
      </form>
    </div>

    <div class="fractal-gallery">
      <img class="fractal-image" src="{{ image_path }}" alt="Fractal de Koch generado">

  <script>
    // Generar partículas flotantes
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 50;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Posición aleatoria
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        
        // Tamaño aleatorio
        const size = Math.random() * 4 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        
        particlesContainer.appendChild(particle);
      }
    }

    // Efecto de loading en el botón
    document.querySelector('.generate-btn').addEventListener('click', function(e) {
      if (!this.querySelector('.loading')) {
        const loading = document.createElement('span');
        loading.className = 'loading';
        this.appendChild(loading);
      }
    });

    // Inicializar partículas cuando se carga la página
    document.addEventListener('DOMContentLoaded', createParticles);

    // Efecto parallax sutil
    document.addEventListener('mousemove', function(e) {
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;
      
      const particles = document.querySelectorAll('.particle');
      particles.forEach((particle, index) => {
        const speed = (index % 5 + 1) * 0.5;
        const x = (mouseX - 0.5) * speed;
        const y = (mouseY - 0.5) * speed;
        particle.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body>
</html>
